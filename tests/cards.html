<!doctype html><html lang="th"><head><meta charset="UTF-8"><title>ทดสอบไพ่</title><link rel="stylesheet" href="../css/style.css"><style>body{padding:20px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}h2{margin:12px 0;font-size:16px}</style></head><body><h1>ไพ่ครบสำรับ 52 ใบ + หลังไพ่</h1><div id="all"></div><script type="module">import{newDeck}from'../js/pokdeng.js';import{renderCard}from'../js/cards.js';const all=document.querySelector('#all'),by={s:[],h:[],d:[],c:[]};for(const c of newDeck())by[c.s].push(c);for(const s of ['s','h','d','c']){const h=document.createElement('h2');h.textContent={s:'♠️ โพดำ',h:'♥️ หัวใจ',d:'♦️ ข้าวหลามตัด',c:'♣️ ดอกจิก'}[s];const r=document.createElement('div');r.className='row';by[s].forEach(c=>r.append(renderCard(c)));all.append(h,r)}const r=document.createElement('div');r.className='row';for(const size of ['sm','md','lg']){const c=renderCard({r:12,s:'h'},{size,faceUp:false});c.onclick=()=>c.classList.toggle('faceup');r.append(c)}all.append(r)</script></body></html>
